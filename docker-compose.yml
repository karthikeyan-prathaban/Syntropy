services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novaa
      POSTGRES_PASSWORD: novaa
      POSTGRES_DB: novaa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://novaa:novaa@postgres:5432/novaa
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://novaa:novaa@postgres:5432/novaa
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - statement_data:/app/var/statements
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: arq app.workers.settings.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://novaa:novaa@postgres:5432/novaa
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - statement_data:/app/var/statements
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  statement_data:
