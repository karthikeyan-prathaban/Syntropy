services:
  - type: web
    name: novaa-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Migrations are the only schema path, so they run before the app starts.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEMO_ROUTES
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: novaa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: novaa-redis
          property: connectionString
      - key: SETU_CLIENT_ID
        sync: false
      - key: SETU_CLIENT_SECRET
        sync: false
      - key: SETU_ORG_ID
        sync: false
      - key: SETU_PRODUCT_INSTANCE_ID
        sync: false
      - key: SETU_WEBHOOK_SECRET
        sync: false
      - key: SETU_FIU_BASE_URL
        value: https://fiu-sandbox.setu.co
      - key: SETU_AUTH_URL
        value: https://orgservice-prod.setu.co/v1/users/login
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://novaa.onrender.com
      - key: REDIRECT_URL
        value: https://novaa.onrender.com/consent/callback
      - key: CORS_ORIGINS
        value: https://novaa.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: novaa-worker
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: arq app.workers.settings.WorkerSettings
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEMO_ROUTES
        value: "false"
      # The worker decrypts the same data, so it needs the identical keys.
      - key: JWT_SECRET
        fromService:
          type: web
          name: novaa-api
          envVarKey: JWT_SECRET
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: novaa-api
          envVarKey: ENCRYPTION_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: novaa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: novaa-redis
          property: connectionString
      - key: SETU_CLIENT_ID
        sync: false
      - key: SETU_CLIENT_SECRET
        sync: false
      - key: SETU_ORG_ID
        sync: false
      - key: SETU_PRODUCT_INSTANCE_ID
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: redis
    name: novaa-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: novaa
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://novaa-api.onrender.com

databases:
  - name: novaa-db
    region: singapore
    plan: basic-256mb
    databaseName: novaa
    user: novaa
