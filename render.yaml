services:
  # ── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: syntropy-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SETU_CLIENT_ID
        sync: false
      - key: SETU_CLIENT_SECRET
        sync: false
      - key: SETU_ORG_ID
        sync: false
      - key: SETU_PRODUCT_INSTANCE_ID
        sync: false
      - key: SETU_FIU_BASE_URL
        value: https://fiu-sandbox.setu.co
      - key: SETU_AUTH_URL
        value: https://orgservice-prod.setu.co/v1/users/login
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: syntropy-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://syntropy.onrender.com
      - key: REDIRECT_URL
        value: https://syntropy.onrender.com/consent/callback
      - key: CORS_ORIGINS
        value: https://syntropy.onrender.com,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false

  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: syntropy
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://syntropy-api.onrender.com

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: syntropy-db
    region: singapore
    plan: free
    databaseName: syntropy
    user: syntropy
