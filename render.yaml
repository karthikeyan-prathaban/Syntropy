services:
  - type: web
    name: novaa-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SETU_CLIENT_ID
        sync: false
      - key: SETU_CLIENT_SECRET
        sync: false
      - key: SETU_ORG_ID
        sync: false
      - key: SETU_PRODUCT_INSTANCE_ID
        sync: false
      - key: SETU_FIU_BASE_URL
        value: https://fiu-sandbox.setu.co
      - key: SETU_AUTH_URL
        value: https://orgservice-prod.setu.co/v1/users/login
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: novaa-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://novaa.onrender.com
      - key: REDIRECT_URL
        value: https://novaa.onrender.com/consent/callback
      - key: CORS_ORIGINS
        value: https://novaa.onrender.com,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: novaa
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://novaa-api.onrender.com

databases:
  - name: novaa-db
    region: singapore
    plan: free
    databaseName: novaa
    user: novaa
